services:
  web:
    build: .
    image: docker-web-server:latest
    container_name: web
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true            # root filesystem is immutable
    tmpfs:
      - /tmp                   # nginx needs a writable /tmp for pid and temp files
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
